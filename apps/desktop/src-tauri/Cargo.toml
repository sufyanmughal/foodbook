[package]
name = "foodbook"
version = "0.1.0"
description = "Foodbook & Catering Operations"
authors = ["NDY"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "foodbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Wordt door `tauri build` gebruikt om de webview naar de productie-URL te laten wijzen.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
